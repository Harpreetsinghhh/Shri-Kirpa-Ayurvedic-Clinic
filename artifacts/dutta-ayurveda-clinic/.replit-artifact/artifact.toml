kind = "web"
previewPath = "/"
title = "Shri Kirpa Ayurvedic Clinic"
version = "1.0.0"
id = "artifacts/dutta-ayurveda-clinic"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 24897

[services.development]
run = "pnpm --filter @workspace/dutta-ayurveda-clinic run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/dutta-ayurveda-clinic", "run", "build" ]
serve = "static"
publicDir = "artifacts/dutta-ayurveda-clinic/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "24897"
BASE_PATH = "/"
